name: eploy to ec2
on:
    push:
      branch:
          -main

jobs: 
   deploy:
      runs-on: ubuntu-latest

      steps:  
       - name: checkout code
         uses: actions/checkout@v6
      
       - name: deploy vis ssh
         uses: appleboy/ssh-action@v1
         with: 
          host: ${{secrets.SSH_HOST}}
          username: ubuntu
          key: ${{secrets.SSH_KEY}}
          script: |
           cd ~/level5
           git pull
           sudo docker compose down
           sudo docker compose up -d --build



            